[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaspire-tools"
version = "0.1.0"
description = "AASPIRE's tools: ModLib and modgen, modreg, modplan, modsync, modlink and modpy, for modules that describe themselves in an AAS and run IEC 61499"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "iec61499-mgmt @ git+https://github.com/AAU-AASPIRE/iec61499-mgmt-py",
    # The archive, not git+: pip would fetch aas-model's submodules, whose paths are too long for Windows.
    "aas-model @ https://github.com/AAU-AASPIRE/aas-model/archive/e23b8e0b26363635d43be7cf7f8e2cbbb75a988a.zip",
    "basyx-python-sdk>=2.1,<3", "pydantic>=2.9,<3", "rdflib>=7,<8", "pyyaml>=6,<7", "defusedxml>=0.7,<1",
    "gtpyhop-core==2.0.2",
    # OPC UA (modlink, modpy) and discovery by mDNS (modreg serve --discover, modpy).
    "asyncua>=1.1", "zeroconf>=0.132",
]

[project.optional-dependencies]
# Standard planners on modplan's PDDL and HDDL: unified-planning, ENHSP (needs Java) and Aries.
planners = ["unified-planning==1.3.0", "up-enhsp==0.1.1", "up-aries==0.5.0"]
test = ["pytest>=7,<9", "owlrl", "pyshacl"]

[project.scripts]
modgen = "modgen.__main__:main"
modreg = "modreg.__main__:main"
modplan = "modplan.__main__:main"
modsync = "modsync.__main__:main"
modpy = "modpy.__main__:main"

[tool.setuptools]
packages = ["modgen", "modreg", "modplan", "modplan.execution", "modsync", "modlink", "modpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
